name: CI/CD Pipeline

on:
  push:
    branches: ["dev"]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t task-manager:${{ github.sha }} .

  test:
    needs: build
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.2"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest Flask-Testing SQLAlchemy flask_sqlalchemy flask_login flask_bcrypt flask_wtf
      - name: Run tests
        run: pytest tests/ --verbose --junitxml=test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
        if: always()

  bandit:
    needs: build
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Bandit Analysis
        uses: PyCQA/bandit-action@v1
        with:
          path: "."
          output: "bandit-report.txt"
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  dependency_check:
    needs: build
    name: Dependency-Check (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Task-Manager-using-Flask"
          path: "."
          format: "HTML"
          out: "reports"
          args: >
            --scan "**/*.py"
            --scan "requirements.txt"
            --failOnCVSS 7
            --enableRetired
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: Dependency-Check report
          path: reports
        if: always()

  zap:
    needs: [bandit, dependency_check]
    name: ZAP Scanning Report (DAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t task-manager:${{ github.sha }} .
      - name: Run application
        run: |
          docker run -d -p 5000:5000 --name task-manager task-manager:${{ github.sha }}
          timeout 30s bash -c "until curl -s http://localhost:5000; do sleep 1; done" || exit 1
      - name: Zap Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:5000"
          artifact_name: zap-scan-report
      - name: Stop Docker container
        run: docker stop task-manager
      - name: Upload ZAP Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap_scan_results/zap_scan_report.html
        if: always()

  loki:
    needs: zap
    name: Loki Setup
    runs-on: ubuntu-latest
    services:
      loki:
        image: grafana/loki:latest
        ports:
          - 3100:3100
      promtail:
        image: grafana/promtail:latest
        volumes:
          - ./logs:/var/log
          - ./promtail-config.yml:/etc/promtail/config.yml
    steps:
      - uses: actions/checkout@v4
      - name: Create Promtail config
        run: |
          echo "server:
            http_listen_port: 9080
          clients:
            - url: http://loki:3100/loki/api/v1/push
          scrape_configs:
            - job_name: system
              static_configs:
                - targets: [localhost]
                  labels:
                    job: task-manager
                    __path__: /var/log/*.log" > promtail-config.yml
      - name: Verify Loki
        run: echo "Loki running at http://localhost:3100"

  grafana:
    needs: loki
    name: Grafana Setup
    runs-on: ubuntu-latest
    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000
    steps:
      - name: Wait for Grafana
        run: sleep 10
      - name: Configure Grafana datasource
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"name":"Loki","type":"loki","url":"http://loki:3100","access":"proxy"}' \
            http://admin:admin@localhost:3000/api/datasources
      - name: Access Grafana Dashboard
        run: echo "Grafana running at http://localhost:3000"

  pull_request_automatic:
    needs: grafana
    name: Deploy Stage para Simulação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the Action
        uses: devops-infra/action-pull-request@v0.5.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          title: Create pull request automatic
          target_branch: staging
          assignee: ${{ github.actor }}
          label: automatic
          get_diff: true