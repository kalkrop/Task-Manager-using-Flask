name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - stage
      - dev
  pull_request:
    branches:
      - main
      - stage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.2'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Docker image
        run: |
          docker build -t task-manager:${{ github.sha }} .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.2'
      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          pytest --junitxml=test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.xml

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.2'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r . -f txt -o bandit-report.txt
      - name: Install Dependency-Check
        run: |
          curl -L https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip -o depcheck.zip
          unzip depcheck.zip
      - name: Run Dependency-Check
        run: ./dependency-check/bin/dependency-check.sh --scan . --format HTML --out depcheck-report.html
      - name: Upload SAST reports
        uses: actions/upload-artifact@v3
        with:
          name: sast-reports
          path: |
            bandit-report.txt
            depcheck-report.html

  deploy-stage:
    runs-on: ubuntu-latest
    needs: [test, sast]
    if: github.ref == 'refs/heads/stage'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to staging
        run: |
          docker run -d -p 8080:5000 task-manager:${{ github.sha }}

  dast:
    runs-on: ubuntu-latest
    needs: deploy-stage
    if: github.ref == 'refs/heads/stage'
    steps:
      - name: Run OWASP ZAP
        run: |
          docker run -t owasp/zap2docker-stable zap-baseline.py -t http://localhost:8080 -r zap-report.html
      - name: Upload DAST report
        uses: actions/upload-artifact@v3
        with:
          name: dast-report
          path: zap-report.html

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [test, sast]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to production
        run: |
          docker run -d -p 5000:5000 task-manager:${{ github.sha }}